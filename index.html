<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>JandyPump</title>
  <meta name="description" content="Jazz & Andy's workout tracker">
  <meta name="theme-color" content="#12002b">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Monoton&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="backdrop" aria-hidden="true">
    <div class="sun"></div>
    <div class="grid-floor"></div>
  </div>
  <div class="scanlines" aria-hidden="true"></div>

  <header class="topbar">
    <h1 class="logo" data-action="nav" data-view="plan">Jandy<span>Pump</span></h1>
    <div class="who" role="group" aria-label="Whose workout">
      <button data-action="person" data-person="jazz">Jazz</button>
      <button data-action="person" data-person="andy">Andy</button>
    </div>
    <button class="icon-btn sync-btn" data-action="sync" title="Sync" aria-label="Sync">⟳</button>
    <button class="icon-btn" data-action="nav" data-view="settings" title="Settings" aria-label="Settings">⚙</button>
  </header>

  <main id="app"></main>

  <nav class="tabbar">
    <button data-action="nav" data-view="plan"><span>🎲</span>Plan</button>
    <button data-action="nav" data-view="log"><span>🥊</span>Log</button>
    <button data-action="nav" data-view="stats"><span>📈</span>Stats</button>
    <button data-action="nav" data-view="goals"><span>🏆</span>Goals</button>
  </nav>

  <div id="modal" class="modal" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
